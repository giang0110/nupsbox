name: P2.4 Production Smoke Once

on:
  pull_request:
    paths:
      - '.github/p24-smoke-trigger'

jobs:
  production-http-smoke:
    if: github.head_ref == 'codex/p24-production-go-live-readiness'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Submit exactly two valid production requests
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f .github/p24-smoke-trigger ]; then
            echo 'Trigger file absent; no production request sent.'
            exit 0
          fi

          run_id=$(tr -d '\r\n' < .github/p24-smoke-trigger)
          if [[ ! "$run_id" =~ ^[A-Za-z0-9_-]{6,64}$ ]]; then
            echo 'Invalid smoke run id'
            exit 1
          fi

          base_url='https://nupsbox.vercel.app'
          marker="p24-smoke:${run_id}"
          booking_marker="${marker}:booking"
          scheduled_at=$(date -u -d '+2 hours' +'%Y-%m-%dT%H:%M:%SZ')

          invalid_payload=$(jq -nc --arg marker "$marker" '{
            fullName:"P2.4 Production Smoke",
            phone:"bad-phone",
            preferredLanguage:"vi",
            needType:"other",
            estimatedVolume:"unknown",
            message:$marker,
            source:"p24_production_smoke",
            utmCampaign:$marker,
            landingPage:"/p24-production-smoke"
          }')
          invalid_code=$(curl -sS --max-time 30 -o invalid.json -w '%{http_code}' \
            -X POST -H 'content-type: application/json' --data "$invalid_payload" \
            "${base_url}/api/leads")
          echo "invalid_status=${invalid_code}"
          test "$invalid_code" = '400'

          lead_payload=$(jq -nc --arg marker "$marker" '{
            fullName:"P2.4 Production Smoke",
            phone:"00000000",
            preferredLanguage:"vi",
            needType:"other",
            estimatedVolume:"unknown",
            message:$marker,
            source:"p24_production_smoke",
            utmCampaign:$marker,
            landingPage:"/p24-production-smoke"
          }')
          lead_code=$(curl -sS --max-time 30 -o lead.json -w '%{http_code}' \
            -X POST -H 'content-type: application/json' --data "$lead_payload" \
            "${base_url}/api/leads")
          echo "lead_status=${lead_code}"
          cat lead.json
          echo
          test "$lead_code" = '201'
          jq -e '.ok == true and (.leadId | type == "string") and .appointmentId == null' lead.json >/dev/null

          booking_payload=$(jq -nc \
            --arg marker "$booking_marker" \
            --arg scheduledAt "$scheduled_at" \
            '{
              fullName:"P2.4 Production Smoke",
              phone:"00000001",
              preferredLanguage:"vi",
              needType:"other",
              estimatedVolume:"unknown",
              message:$marker,
              source:"p24_production_smoke",
              utmCampaign:$marker,
              landingPage:"/p24-production-smoke",
              appointment:{
                scheduledAt:$scheduledAt,
                durationMinutes:30,
                customerNote:$marker
              }
            }')
          booking_code=$(curl -sS --max-time 30 -o booking.json -w '%{http_code}' \
            -X POST -H 'content-type: application/json' --data "$booking_payload" \
            "${base_url}/api/leads")
          echo "booking_status=${booking_code}"
          cat booking.json
          echo
          test "$booking_code" = '201'
          jq -e '.ok == true and (.leadId | type == "string") and (.appointmentId | type == "string")' booking.json >/dev/null
