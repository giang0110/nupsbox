name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run build

  vercel-parity-diagnostic:
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [24.11.0, 24.21.0]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Record runtime and app env presence
        run: |
          node --version
          npm --version
          node -e "console.log({NEXT_PUBLIC_SUPABASE_URL: !!process.env.NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: !!process.env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY, NEXT_PUBLIC_SITE_URL: !!process.env.NEXT_PUBLIC_SITE_URL, SUPABASE_SERVICE_ROLE_KEY: !!process.env.SUPABASE_SERVICE_ROLE_KEY, LEAD_RATE_LIMIT_SALT: !!process.env.LEAD_RATE_LIMIT_SALT})"
      - name: Install from lockfile
        run: npm ci
      - name: Clean build without application env
        run: |
          rm -rf .next
          env -u NEXT_PUBLIC_SUPABASE_URL \
              -u NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY \
              -u NEXT_PUBLIC_SITE_URL \
              -u SUPABASE_SERVICE_ROLE_KEY \
              -u LEAD_RATE_LIMIT_SALT \
              npm run build
