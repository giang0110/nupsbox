name: Bootstrap npm lockfile

on:
  push:
    branches: [codex/phase-1-foundation]

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/phase-1-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Generate and commit lockfile when absent
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            echo "package-lock.json already exists"
            exit 0
          fi
          npm install --package-lock-only --ignore-scripts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: add npm lockfile"
          git push origin HEAD:codex/phase-1-foundation
