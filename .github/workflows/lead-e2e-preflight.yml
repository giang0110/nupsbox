name: Lead E2E Preflight

on:
  pull_request:

jobs:
  lead-e2e-preflight:
    if: github.event.pull_request.head.ref == 'codex/phase-1-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: read
    env:
      PREVIEW_URL: https://nupsbox-git-codex-phase-1-foundation-ntg2299.vercel.app
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Wait for Vercel status on exact head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state="missing"
          for _ in $(seq 1 60); do
            payload=$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/status")
            state=$(printf '%s' "$payload" | jq -r '[.statuses[] | select(.context == "Vercel")][0].state // "missing"')
            echo "Vercel status: ${state}"
            if [ "$state" = "success" ]; then
              break
            fi
            if [ "$state" = "failure" ] || [ "$state" = "error" ]; then
              exit 1
            fi
            sleep 5
          done
          test "$state" = "success"

      - name: Submit synthetic lead through Preview API
        run: |
          marker="chatgpt_preflight:${HEAD_SHA}"
          body=$(jq -nc \
            --arg marker "$marker" \
            '{fullName:"NupsBox Preflight Test",phone:"+84900000001",preferredLanguage:"vi",needType:"other",estimatedVolume:"unknown",message:"Automated NupsBox preflight test; safe to delete.",website:"",source:$marker,landingPage:"/preflight"}')
          response_file=$(mktemp)
          code=$(curl -sS -o "$response_file" -w '%{http_code}' \
            --max-time 30 \
            -H 'content-type: application/json' \
            --data "$body" \
            "${PREVIEW_URL}/api/leads" || true)
          echo "POST /api/leads -> ${code}"
          cat "$response_file"
          echo
          test "$code" = "201"
